<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12141c">
    <meta name="description" content="Organize seu tempo com o método Pomodoro.">
    <title>Pomodoro Focus</title>


    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="container py-5 text-center">

        <header class="text-center mb-5">
            <h1>Pomodoro Focus</h1>
            <p>Organize seu tempo. Concentre-se no que importa.</p>
        </header>

        <!-- Temporizador -->
        <section class="timer-container text-center mb-5">

            <h2 id="title_session">Tempo de Concentração</h2>

            <div id="timer">25:00</div>

            <div class="d-flex justify-content-center gap-2 mt-4">
                <button id="btn_start" class="btn btn-success">
                    Iniciar
                </button>

                <button id="btn_reset" class="btn btn-warning">
                    Reiniciar
                </button>
            </div>
            <p id="status" class="mt-3">
                Pronto para começar!
            </p>
        </section>

        <!-- Sessões -->
        <section class="row g-3">

            <div class="col-12 col-md-6">
                <div class="session-card" data-session="1">
                    <h3>Sessão 1</h3>

                    <div class="session-item">
                        <span>Foco</span>
                        <span>25 minutos</span>
                    </div>

                    <div class="session-item">
                        <span>Pausa</span>
                        <span>5 minutos</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="session-card" data-session="2">
                    <h3>Sessão 2</h3>

                    <div class="session-item">
                        <span>Foco</span>
                        <span>25 minutos</span>
                    </div>

                    <div class="session-item">
                        <span>Pausa</span>
                        <span>5 minutos</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="session-card" data-session="3">
                    <h3>Sessão 3</h3>

                    <div class="session-item">
                        <span>Foco</span>
                        <span>25 minutos</span>
                    </div>

                    <div class="session-item">
                        <span>Pausa</span>
                        <span>5 minutos</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="session-card" data-session="4">
                    <h3>Sessão 4</h3>

                    <div class="session-item">
                        <span>Foco</span>
                        <span>25 minutos</span>
                    </div>

                    <div class="session-item">
                        <span>Pausa</span>
                        <span>15 minutos</span>
                    </div>
                </div>
            </div>

        </section>

        <div class="text-center mt-4">
            <button id="btn_install" class="btn btn-outline-light d-none">
                Instalar aplicativo
            </button>
        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript personalizado -->
    <script src="script.js"></script>

</body>

</html>
